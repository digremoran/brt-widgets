<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual-Bloch &amp; ER=EPR Voxel Bridge: Geometry of Correlation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0e14;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 12px 20px;
    background: #111622;
    border-bottom: 1px solid #1e293b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; color: #f8fafc; }
  header span { font-size: 12px; color: #94a3b8; }
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 10px 20px;
    background: #0f131d;
    border-bottom: 1px solid #1e293b;
  }
  .metric-card {
    background: #151b28;
    border: 1px solid #222d42;
    border-radius: 6px;
    padding: 8px 12px;
  }
  .metric-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #64748b; }
  .metric-val { font-size: 14px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #38bdf8; margin-top: 2px; }
  #canvas-wrap {
    flex: 1;
    position: relative;
    min-height: 240px;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .controls {
    padding: 12px 20px;
    background: #111622;
    border-top: 1px solid #1e293b;
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 16px;
    align-items: center;
  }
  .slider-group { display: flex; flex-direction: column; gap: 4px; }
  .slider-header { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; }
  input[type=range] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover { border-color: #38bdf8; color: #fff; }
  button.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Dual-Bloch &amp; ER=EPR Voxel Bridge</h1>
  <span>Geometry of Non-Local Correlation &bull; Beyond Real Time</span>
</header>

<div class="metrics">
  <div class="metric-card">
    <div class="metric-label">Entanglement (&gamma;)</div>
    <div class="metric-val" id="m-gamma">0.85</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Local Purity Tr(&rho;<sub>A</sub>&sup2;)</div>
    <div class="metric-val" id="m-purity">0.56</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Concurrence C(&rho;)</div>
    <div class="metric-val" id="m-conc">0.85</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Lofted Bridge Voxels</div>
    <div class="metric-val" id="m-voxels">23 / 27</div>
  </div>
</div>

<div id="canvas-wrap"></div>

<div class="controls">
  <div class="slider-group">
    <div class="slider-header">
      <span>Entanglement Coupling (&gamma;: Local &rarr; ER=EPR)</span>
      <span id="lbl-gamma">0.85</span>
    </div>
    <input type="range" id="sl-gamma" min="0" max="1" step="0.01" value="0.85">
  </div>
  <div class="slider-group">
    <div class="slider-header">
      <span>MRI Tomographic Slice Plane (Z-Sweep)</span>
      <span id="lbl-slice">0.00</span>
    </div>
    <input type="range" id="sl-slice" min="-1.2" max="1.2" step="0.02" value="0.0">
  </div>
  <div class="presets">
    <button onclick="setGamma(0)">Separable (0)</button>
    <button onclick="setGamma(0.5)">Partial (0.5)</button>
    <button onclick="setGamma(1)" class="active">Bell / ER=EPR (1.0)</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0b0e14, 0.045);

  const camera = new THREE.PerspectiveCamera(42, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
  camera.position.set(0, 2.4, 8.2);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0b0e14);
  wrap.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.1);
  dirLight.position.set(5, 8, 6);
  scene.add(dirLight);

  function createBlochSphere(xPos) {
    const group = new THREE.Group();
    group.position.x = xPos;
    const sphereGeo = new THREE.SphereGeometry(1.15, 24, 18);
    const wireMat = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.35 });
    group.add(new THREE.Mesh(sphereGeo, wireMat));

    const coreGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
    group.add(new THREE.Mesh(coreGeo, coreMat));

    const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 1.05, 0x38bdf8, 0.22, 0.14);
    group.add(arrow);
    scene.add(group);
    return { group, arrow };
  }

  const blochA = createBlochSphere(-3.1);
  const blochB = createBlochSphere(3.1);

  // 3x3x3 Voxel Lattice Bridge
  const voxelGroup = new THREE.Group();
  const voxels = [];
  const boxGeo = new THREE.BoxGeometry(0.42, 0.42, 0.42);
  for (let ix = -1; ix <= 1; ix++) {
    for (let iy = -1; iy <= 1; iy++) {
      for (let iz = -1; iz <= 1; iz++) {
        const dist = Math.sqrt(ix * ix + iy * iy + iz * iz);
        const mat = new THREE.MeshPhongMaterial({
          color: 0x38bdf8,
          emissive: 0x0284c7,
          emissiveIntensity: 0.35,
          transparent: true,
          opacity: 0.85
        });
        const mesh = new THREE.Mesh(boxGeo, mat);
        mesh.position.set(ix * 0.62, iy * 0.62, iz * 0.62);
        voxelGroup.add(mesh);
        voxels.push({ mesh, ix, iy, iz, dist });
      }
    }
  }
  scene.add(voxelGroup);

  // Tomographic MRI Slice Plane
  const sliceGeo = new THREE.PlaneGeometry(2.3, 2.3);
  const sliceMat = new THREE.MeshBasicMaterial({
    color: 0x22d3ee,
    transparent: true,
    opacity: 0.16,
    side: THREE.DoubleSide
  });
  const slicePlane = new THREE.Mesh(sliceGeo, sliceMat);
  const sliceEdges = new THREE.LineSegments(
    new THREE.EdgesGeometry(sliceGeo),
    new THREE.LineBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.75 })
  );
  slicePlane.add(sliceEdges);
  scene.add(slicePlane);

  // ER=EPR Lofted Filaments
  const linkMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 });
  const linkGroup = new THREE.Group();
  [-0.6, 0, 0.6].forEach(y => {
    [-0.6, 0, 0.6].forEach(z => {
      const pts = [new THREE.Vector3(-2.1, y * 0.4, z * 0.4), new THREE.Vector3(0, y, z), new THREE.Vector3(2.1, y * 0.4, z * 0.4)];
      const curve = new THREE.CatmullRomCurve3(pts);
      const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(24));
      linkGroup.add(new THREE.Line(geo, linkMat));
    });
  });
  scene.add(linkGroup);

  let gamma = 0.85;
  let sliceZ = 0.0;

  function updateState() {
    document.getElementById('m-gamma').textContent = gamma.toFixed(2);
    document.getElementById('lbl-gamma').textContent = gamma.toFixed(2);
    document.getElementById('lbl-slice').textContent = sliceZ.toFixed(2);

    // Local Bloch vector shrinks to 0 at gamma = 1
    const vecLen = Math.max(0.04, 1.05 * (1 - gamma));
    blochA.arrow.setLength(vecLen, Math.min(0.22, vecLen * 0.35), Math.min(0.14, vecLen * 0.22));
    blochB.arrow.setLength(vecLen, Math.min(0.22, vecLen * 0.35), Math.min(0.14, vecLen * 0.22));

    // Purity Tr(rho^2) = 0.5 * (1 + (1 - gamma)^2)
    const purity = 0.5 * (1 + Math.pow(1 - gamma, 2));
    document.getElementById('m-purity').textContent = purity.toFixed(2);
    document.getElementById('m-conc').textContent = gamma.toFixed(2);

    slicePlane.position.z = sliceZ;
    linkMat.opacity = 0.08 + gamma * 0.48;

    let activeCount = 0;
    voxels.forEach(v => {
      const threshold = (1.75 - v.dist) / 1.75;
      const isActive = gamma >= (1 - threshold) * 0.85 && gamma > 0.02;
      const inSlice = Math.abs(v.mesh.position.z - sliceZ) < 0.34;
      if (isActive) {
        activeCount++;
        v.mesh.visible = true;
        v.mesh.material.color.setHex(inSlice ? 0x22d3ee : 0x38bdf8);
        v.mesh.material.emissiveIntensity = inSlice ? 0.85 : 0.3;
        v.mesh.material.opacity = inSlice ? 0.96 : 0.45 + gamma * 0.35;
        const s = inSlice ? 1.12 : 0.92;
        v.mesh.scale.set(s, s, s);
      } else {
        v.mesh.visible = false;
      }
    });
    document.getElementById('m-voxels').textContent = `${activeCount} / 27`;
  }

  document.getElementById('sl-gamma').addEventListener('input', e => {
    gamma = parseFloat(e.target.value);
    updateState();
  });
  document.getElementById('sl-slice').addEventListener('input', e => {
    sliceZ = parseFloat(e.target.value);
    updateState();
  });
  window.setGamma = function(val) {
    gamma = val;
    document.getElementById('sl-gamma').value = val;
    updateState();
  };

  let isDragging = false, prevX = 0, rotY = 0;
  wrap.addEventListener('pointerdown', e => { isDragging = true; prevX = e.clientX; });
  window.addEventListener('pointerup', () => { isDragging = false; });
  window.addEventListener('pointermove', e => {
    if (!isDragging) return;
    rotY += (e.clientX - prevX) * 0.008;
    prevX = e.clientX;
  });

  window.addEventListener('resize', () => {
    camera.aspect = wrap.clientWidth / wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  });

  function animate(t) {
    requestAnimationFrame(animate);
    const time = t * 0.001;
    voxelGroup.rotation.y = rotY + Math.sin(time * 0.35) * 0.18;
    slicePlane.rotation.y = voxelGroup.rotation.y;
    blochA.group.rotation.y = time * 0.4;
    blochB.group.rotation.y = -time * 0.4;
    renderer.render(scene, camera);
  }

  updateState();
  animate(0);
</script>
</body>
</html>
